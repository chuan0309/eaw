name: 臺灣368鄉鎮免費公開新聞RSS巡檢 (100%無付費API)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  crawl_and_update_db:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝免費基礎套件
        run: |
          pip install --upgrade pip
          pip install "supabase>=2.4.0" "requests>=2.31.0"

      - name: 4. 執行免費公開新聞 RSS 與內建行政區座標入庫 (無任何付費 API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u crawler.py
