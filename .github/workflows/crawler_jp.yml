name: Japan Jiko Bukken Crawler (日本全境獨立爬蟲)

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-japan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Japan Crawler (15 Prefectures / 109 Districts)
        run: python crawler_jp.py

      - name: Commit and Push updated archive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add calibrated_archive.json public/calibrated_archive.json initial_boot_records.json public/initial_boot_records.json
          git diff --staged --quiet || (git commit -m "Auto-update: Japan 111 districts crawler [skip ci]" && git pull --rebase origin main && git push)
