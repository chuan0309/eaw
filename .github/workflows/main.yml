name: Taiwan & Japan Haunted Property Crawlers (臺灣・日本 分別獨立爬蟲)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-taiwan-japan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 1. Run Taiwan Independent Crawler (crawler_tw.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crawler_tw.py

      - name: 2. Run Japan Independent Crawler (crawler_jp.py)
        run: python crawler_jp.py

      - name: Commit and Push updated archive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A calibrated_archive.json public/calibrated_archive.json initial_boot_records.json public/initial_boot_records.json crawler_vault_backup.json public/crawler_vault_backup.json
          git diff --staged --quiet || (git commit -m "Auto-update: TW + JP independent crawlers [skip ci]" && git pull --rebase --autostash origin main && git push)
