    // 初始化地圖：使用 100% 永久免費免 Key 的 OpenStreetMap + 臺灣內政部國土測繪中心(NLSC) 雙圖層，加上暗黑極簡濾鏡
    const map = L.map("map", { zoomControl: false }).setView([23.75, 120.95], 8);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    const osmDarkLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      className: "dark-minimal-tiles",
      attribution: '&copy; OpenStreetMap 臺灣極簡暗黑模式',
      maxZoom: 19
    });

    const nlscDarkLayer = L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}", {
      className: "dark-minimal-tiles",
      attribution: '&copy; 內政部國土測繪中心 NLSC',
      maxZoom: 19
    });

    // 預設載入內政部繁體中文詳細門牌道路圖資
    nlscDarkLayer.addTo(map);
    L.control.layers({ "內政部詳細街道 (極簡黑)": nlscDarkLayer, "OpenStreetMap (極簡黑)": osmDarkLayer }, null, { position: "topright" }).addTo(map);

    const markerCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 42 });
    map.addLayer(markerCluster);

    let allRecords = [];

    const citySelect = document.getElementById("city-select");
    const districtSelect = document.getElementById("district-select");
    const searchInput = document.getElementById("search-input");
    const resetBtn = document.getElementById("reset-btn");
    const refreshBtn = document.getElementById("refresh-btn");

    Object.keys(TAIWAN_DISTRICTS).forEach(city => {
      const opt = document.createElement("option");
      opt.value = city; opt.textContent = city;
      citySelect.appendChild(opt);
    });

    citySelect.addEventListener("change", () => {
      const selectedCity = citySelect.value;
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      if (selectedCity && TAIWAN_DISTRICTS[selectedCity]) {
        TAIWAN_DISTRICTS[selectedCity].forEach(dist => {
          const opt = document.createElement("option");
          opt.value = dist; opt.textContent = dist;
          districtSelect.appendChild(opt);
        });
      }
      applyFilters();
    });

    districtSelect.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);
    resetBtn.addEventListener("click", () => {
      citySelect.value = "";
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      searchInput.value = "";
      applyFilters();
      map.setView([23.75, 120.95], 8);
    });
    refreshBtn.addEventListener("click", loadAllData);

    // 自動合併「內建歷史種子庫」與「Supabase 雲端即時爬蟲庫」
    async function loadAllData() {
      const statusEl = document.getElementById("db-status");
      const mergedMap = new Map();
      HISTORICAL_SEED_DATA.forEach(item => mergedMap.set(item.address, item));

      if (!SUPABASE_ANON_KEY.startsWith("eyJ")) {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> 已載入全臺歷史基底庫 (${mergedMap.size} 筆) · 填入 anon key 可同步雲端新增`;
        allRecords = Array.from(mergedMap.values());
        applyFilters();
        return;
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let from = 0;
        const step = 1000;
        while (true) {
          const { data, error } = await supabase
            .from("haunted_houses")
            .select("*")
            .order("created_at", { ascending: false })
            .range(from, from + step - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          data.forEach(row => mergedMap.set(row.address, row));
          if (data.length < step) break;
          from += step;
        }
        allRecords = Array.from(mergedMap.values());
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端自動爬蟲即時連線中 (共 ${allRecords.length} 筆)`;
        applyFilters();
      } catch (err) {
        console.warn("Supabase 讀取異常，使用內建全臺歷史庫:", err);
        allRecords = Array.from(mergedMap.values());
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> 歷史資料庫模式 (${allRecords.length} 筆)`;
        applyFilters();
      }
    }

    function renderData(records) {
      markerCluster.clearLayers();
      const listContainer = document.getElementById("list-container");
      listContainer.innerHTML = "";
      document.getElementById("total-count").textContent = records.length.toLocaleString();

      const customIcon = L.divIcon({
        className: "",
        html: '<div class="custom-pin"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7],
        popupAnchor: [0, -8]
      });

      records.forEach(item => {
        if (!item.lat || !item.lng) return;
        const popupHtml = `
          <div class="p-2 min-w-[240px] max-w-[290px]">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-[10px] font-mono px-2 py-0.5 bg-neutral-800 text-white rounded border border-neutral-600">${item.city} · ${item.district}</span>
              <span class="text-[11px] font-mono text-neutral-400">${item.incident_date || "歷史紀錄"}</span>
            </div>
            <h3 class="text-sm font-bold text-white leading-snug mb-2">${item.address}</h3>
            <div class="text-xs text-neutral-200 bg-neutral-900 p-2.5 rounded border border-neutral-800 leading-relaxed mb-2">
              <span class="text-neutral-500 block text-[10px] mb-0.5">事件原因與經過：</span>
              ${item.reason || "特殊事故紀錄"}
            </div>
            <div class="flex justify-between items-center text-[10px] text-neutral-400">
              <span>類型：${item.category || "非自然死亡"}</span>
              <span>來源：${item.source || "公開卷宗"}</span>
            </div>
          </div>
        `;

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).bindPopup(popupHtml);
        markerCluster.addLayer(marker);

        const row = document.createElement("div");
        row.className = "p-4 hover:bg-neutral-900 cursor-pointer transition group";
        row.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-medium text-neutral-300 bg-neutral-800/80 px-1.5 py-0.5 rounded">${item.city} ${item.district}</span>
            <span class="text-[11px] font-mono text-neutral-500">${item.incident_date || "歷史紀錄"}</span>
          </div>
          <div class="text-xs font-semibold text-neutral-100 group-hover:text-white mt-1.5 mb-1 truncate">${item.address}</div>
          <div class="text-[11px] text-neutral-400 line-clamp-2 leading-relaxed">${item.reason || ""}</div>
        `;
        row.addEventListener("click", () => {
          map.flyTo([item.lat, item.lng], 17, { duration: 0.7 });
          setTimeout(() => {
            markerCluster.zoomToShowLayer(marker, () => marker.openPopup());
          }, 750);
        });
        listContainer.appendChild(row);
      });
    }

    function applyFilters() {
      const city = citySelect.value.trim();
      const dist = districtSelect.value.trim();
      const kw = searchInput.value.trim().toLowerCase();

      const filtered = allRecords.filter(r => {
        const matchCity = !city || r.city.replace("台","臺") === city.replace("台","臺");
        const matchDist = !dist || r.district === dist;
        const matchKw = !kw ||
          (r.address && r.address.toLowerCase().includes(kw)) ||
          (r.reason && r.reason.toLowerCase().includes(kw)) ||
          (r.category && r.category.toLowerCase().includes(kw)) ||
          (r.district && r.district.toLowerCase().includes(kw));
        return matchCity && matchDist && matchKw;
      });

      renderData(filtered);
      if (filtered.length > 0 && (city || dist || kw)) {
        const bounds = L.latLngBounds(filtered.map(r => [r.lat, r.lng]));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    loadAllData();
    // 每 60 秒前端自動向雲端拉取最新爬蟲進來的案件，不用手動重開
    setInterval(loadAllData, 60000);
  </script>
</body>
</html>
