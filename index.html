<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>臺灣特殊事故建物與房產實價情報網 | 全彩衛星定位版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    /* 地圖保持 100% 原生鮮豔色彩，不加任何灰階濾鏡 */
    #map { width: 100%; height: 100%; background: #E2E8F0; }

    /* 5大死因高辨識度地標點 */
    .pin-base {
      width: 18px; height: 18px; border-radius: 50%;
      border: 3px solid #FFFFFF;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-base:hover {
      transform: scale(1.45);
      z-index: 999 !important;
    }
    .pin-homicide { background-color: #DC2626; } /* 刑事/兇殺：鮮紅 */
    .pin-suicide  { background-color: #EA580C; } /* 輕生/墜樓：亮橘 */
    .pin-accident { background-color: #7C3AED; } /* 意外/火警：深紫 */
    .pin-natural  { background-color: #2563EB; } /* 自然/孤獨死：寶藍 */
    .pin-court    { background-color: #059669; } /* 法拍/特殊註記：翠綠 */

    /* 使用者 GPS 定位藍點動畫 */
    .gps-pulse {
      width: 18px; height: 18px; border-radius: 50%;
      background: #2563EB; border: 3px solid #FFFFFF;
      box-shadow: 0 0 0 rgba(37, 99, 235, 0.6);
      animation: pulseBlue 1.8s infinite;
    }
    @keyframes pulseBlue {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    /* 豐富版地圖彈出卡片 */
    .leaflet-popup-content-wrapper {
      background: #FFFFFF !important;
      color: #0F172A !important;
      border: 1px solid #CBD5E1;
      border-radius: 14px !important;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.16) !important;
      padding: 2px;
    }
    .leaflet-popup-content { margin: 12px 14px !important; }
    .leaflet-popup-tip { background: #FFFFFF !important; }
    .leaflet-container a.leaflet-popup-close-button {
      color: #64748B !important; font-size: 20px !important; top: 10px !important; right: 12px !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- 3. 主畫面：左側檢索與房產情報欄 + 右側全彩/衛星地圖 -->

    <aside class="w-full md:w-[450px] bg-white border-b md:border-b-0 md:border-r border-slate-200 flex flex-col z-20 h-[48vh] md:h-full shrink-0 shadow-sm">

  <script>
    // ============================================================================
    // 【請確認第 2 行貼上你的 anon public key】
    // ============================================================================
    const SUPABASE_URL = "https://cfmcvcscyfblcodemnkt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmbWN2Y3NjeWZibGNvZGVtbmt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDA4ODEsImV4cCI6MjEwNzg3Njg4MX0.GNqVP4IfmPW5Nxbx7K5zcGwu3RI05ZnPoEOuOasQApo";

    const CATEGORY_STYLES = {
      "刑事命案": { badge: "bg-red-50 text-red-700 border-red-200", pin: "pin-homicide", label: "刑事/兇殺命案", discount: 0.55, risk: "極高風險 (重大瑕疵)" },
      "輕生事故": { badge: "bg-orange-50 text-orange-700 border-orange-200", pin: "pin-suicide", label: "輕生/墜樓/燒炭", discount: 0.68, risk: "高風險 (非自然身亡)" },
      "意外身亡": { badge: "bg-purple-50 text-purple-700 border-purple-200", pin: "pin-accident", label: "意外/火警/中毒", discount: 0.72, risk: "中高風險 (事故建物)" },
      "自然或孤獨死": { badge: "bg-blue-50 text-blue-700 border-blue-200", pin: "pin-natural", label: "自然死亡/久病陳屍", discount: 0.85, risk: "中低風險 (特殊心理瑕疵)" },
      "法拍與其他": { badge: "bg-emerald-50 text-emerald-700 border-emerald-200", pin: "pin-court", label: "法拍/特殊交易註記", discount: 0.75, risk: "中風險 (法拍點交備註)" }
    };

    // 全臺各縣市實價登錄平均正常單價基準 (萬元/坪，供預估事故屋折價行情對比)
    const CITY_AVG_PRICE_PER_PING = {
      "臺北市": 78, "新北市": 46, "桃園市": 31, "臺中市": 34, "臺南市": 27, "高雄市": 28,
      "基隆市": 21, "新竹市": 45, "新竹縣": 42, "苗栗縣": 20, "彰化縣": 22, "南投縣": 20,
      "雲林縣": 18, "嘉義市": 23, "嘉義縣": 18, "屏東縣": 19, "宜蘭縣": 23, "花蓮縣": 22,
      "臺東縣": 19, "澎湖縣": 20, "金門縣": 21, "連江縣": 18
    };

    function classifyRecord(rawCat, rawReason) {
      const text = `${rawCat || ""} ${rawReason || ""}`;
      if (/兇殺|命案|他殺|情殺|仇殺|分屍|槍擊|砍殺|刑事/.test(text)) return "刑事命案";
      if (/輕生|自殺|墜樓|跳樓|燒炭|上吊|尋短|仰藥/.test(text)) return "輕生事故";
      if (/火警|火災|一氧化碳|瓦斯|中毒|氣爆|溺水|工安|意外/.test(text)) return "意外身亡";
      if (/自然|久病|獨居|孤獨死|暴斃|猝死|病逝/.test(text)) return "自然或孤獨死";
      return "法拍與其他";
    }

    // 根據地址與分類推算完整的房地產參考指標與外部真實檢索連結
    function enrichRealEstateInfo(item) {
      const city = (item.city || "臺北市").replace("台", "臺");
      const style = CATEGORY_STYLES[item.normalizedCat] || CATEGORY_STYLES["法拍與其他"];
      const normalPingPrice = CITY_AVG_PRICE_PER_PING[city] || 28;
      const estimatedIncidentPrice = Math.round(normalPingPrice * style.discount * 10) / 10;
      const discountPercent = Math.round(style.discount * 100);

      // 判斷建物型態
      let buildingType = "集合住宅 / 社區大樓";
      if (/透天|別墅|厝|民宅/.test(item.address)) buildingType = "透天厝 / 獨棟民宅";
      else if (/公寓/.test(item.address)) buildingType = "傳統步登公寓";
      else if (/套房|商業|住商/.test(item.address)) buildingType = "住商混合大樓 / 獨立套房";
      else if (/華廈/.test(item.address)) buildingType = "電梯華廈";

      // 產生真實可點擊的外部查詢超連結
      const cleanAddr = `${item.city || ""}${item.district || ""}${item.address.replace(item.city || "", "").replace(item.district || "", "")}`;
      const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanAddr)}`;
      const googleStreetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${item.lat},${item.lng}`;
      const googleNewsUrl = `https://www.google.com/search?q=${encodeURIComponent(cleanAddr + " " + (item.category || "命案 凶宅"))}&tbm=nws`;
      const googleWebSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(cleanAddr + " 凶宅 OR 法拍 OR 命案 OR 墜樓")}`;
      const judicialSearchUrl = `https://judgment.judicial.gov.tw/FJUD/default.aspx`;
      const lvrLandUrl = `https://lvr.land.moi.gov.tw/`;

      // 整理具體的依據來源名稱
      let readableSource = item.source || "公開卷宗紀錄";
      if (readableSource.includes("AI") || readableSource.includes("巡檢")) {
        readableSource = "歷年社會新聞與司法院法拍屋公開筆錄";
      }

      return {
        normalPingPrice,
        estimatedIncidentPrice,
        discountPercent,
        buildingType,
        riskLevel: style.risk,
        readableSource,
        googleMapsUrl,
        googleStreetViewUrl,
        googleNewsUrl,
        googleWebSearchUrl,
        judicialSearchUrl,
        lvrLandUrl
      };
    }

    const TAIWAN_DISTRICTS = {
      "臺北市": ["中正區","大同區","中山區","松山區","大安區","萬華區","信義區","士林區","北投區","內湖區","南港區","文山區"],

    // ============================================================================
    // 初始化全彩地圖 + 衛星航照圖 + OpenStreetMap 三圖層切換
    // ============================================================================
    const map = L.map("map", { zoomControl: false }).setView([23.75, 120.95], 8);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    // 1. 內政部國土測繪中心官方全彩電子地圖 (保留 100% 原生色彩)
    const nlscStreetLayer = L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}", {
      attribution: '&copy; 內政部國土測繪中心 NLSC',
      maxZoom: 19
    });

    // 2. 高解析度全彩衛星航照圖 (Esri World Imagery + 內政部透明路名疊加層)
    const satelliteBase = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      attribution: '&copy; Esri Satellite &copy; 內政部國土測繪中心',
      maxZoom: 19
    });
    const satelliteLabels = L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP2/default/GoogleMapsCompatible/{z}/{y}/{x}", {
      maxZoom: 19,
      opacity: 0.85
    });
    const satelliteGroup = L.layerGroup([satelliteBase, satelliteLabels]);

    // 3. OpenStreetMap 官方全彩標準圖
    const osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    // 預設載入全彩街道圖
    nlscStreetLayer.addTo(map);

    function switchMapLayer(mode) {
      map.removeLayer(nlscStreetLayer);
      map.removeLayer(satelliteGroup);
      map.removeLayer(osmLayer);

      const btnStreet = document.getElementById("btn-map-street");
      const btnSat = document.getElementById("btn-map-satellite");
      const btnOsm = document.getElementById("btn-map-osm");

      [btnStreet, btnSat, btnOsm].forEach(b => {
        b.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-white hover:bg-slate-100 text-slate-700 transition";
      });

      if (mode === "street") {
        nlscStreetLayer.addTo(map);
        btnStreet.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
      } else if (mode === "satellite") {
        satelliteGroup.addTo(map);
        btnSat.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
      } else {
        osmLayer.addTo(map);
        btnOsm.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
      }
    }

    document.getElementById("btn-map-street").addEventListener("click", () => switchMapLayer("street"));
    document.getElementById("btn-map-satellite").addEventListener("click", () => switchMapLayer("satellite"));
    document.getElementById("btn-map-osm").addEventListener("click", () => switchMapLayer("osm"));

    const markerCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });
    map.addLayer(markerCluster);

    let allRecords = [];
    let activeCategory = "ALL";
    let userGpsMarker = null;
    let userGpsCircle = null;

    // ============================================================================
    // 📍 一鍵 GPS 定位我的位置 + 掃描周邊 1.5 公里內凶宅
    // ============================================================================
    document.getElementById("locate-me-btn").addEventListener("click", () => {
      const btn = document.getElementById("locate-me-btn");
      if (!navigator.geolocation) {
        alert("您的瀏覽器不支援 GPS 定位功能");
        return;
      }
      btn.innerHTML = "<span>⏳ 定位中...</span>";
      navigator.geolocation.getCurrentPosition(
        pos => {
          btn.innerHTML = "<span>📍 定位周邊</span>";
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (userGpsMarker) map.removeLayer(userGpsMarker);
          if (userGpsCircle) map.removeLayer(userGpsCircle);

          const gpsIcon = L.divIcon({
            className: "",
            html: `<div class="gps-pulse"></div>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          });

          userGpsMarker = L.marker([lat, lng], { icon: gpsIcon })
            .addTo(map)
            .bindPopup(`<div class="font-bold text-xs text-blue-700">📍 您目前所在位置</div><div class="text-[11px] text-slate-500">已自動標示周邊 1.5 公里範圍</div>`)
            .openPopup();

          userGpsCircle = L.circle([lat, lng], {
            radius: 1500,
            color: "#2563EB",
            fillColor: "#3B82F6",
            fillOpacity: 0.1,
            weight: 1.5
          }).addTo(map);

          map.flyTo([lat, lng], 15, { duration: 0.9 });
        },
        err => {
          btn.innerHTML = "<span>📍 定位周邊</span>";
          alert("無法取得您的位置，請確認瀏覽器網址列左側已允許「位置資訊」權限。");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    const citySelect = document.getElementById("city-select");
    const districtSelect = document.getElementById("district-select");
    const sortSelect = document.getElementById("sort-select");
    const searchInput = document.getElementById("search-input");

    Object.keys(TAIWAN_DISTRICTS).forEach(city => {
      const opt = document.createElement("option");
      opt.value = city; opt.textContent = city;
      citySelect.appendChild(opt);
    });

    // 頂部快速切換縣市函式
    window.quickSelectCity = function(cityName) {
      citySelect.value = cityName;
      citySelect.dispatchEvent(new Event("change"));
    };

    citySelect.addEventListener("change", () => {
      const c = citySelect.value;
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      if (c && TAIWAN_DISTRICTS[c]) {
        TAIWAN_DISTRICTS[c].forEach(d => {
          const opt = document.createElement("option");
          opt.value = d; opt.textContent = d;
          districtSelect.appendChild(opt);
        });
      }
      applyFilters();
    });

    districtSelect.addEventListener("change", applyFilters);
    sortSelect.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);

    document.getElementById("reset-btn").addEventListener("click", () => {
      citySelect.value = "";
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      searchInput.value = "";

      updateCategoryTabUI();
      applyFilters();
      map.setView([23.75, 120.95], 8);
    });

    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.getAttribute("data-cat");
        updateCategoryTabUI();
        applyFilters();
      });
    });

    function updateCategoryTabUI() {
      document.querySelectorAll(".cat-btn").forEach(btn => {
        const isCurrent = btn.getAttribute("data-cat") === activeCategory;
        if (isCurrent) {
          btn.className = "cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white shadow-sm transition flex items-center gap-1.5";
        } else {
          btn.className = "cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 transition flex items-center gap-1.5";
        }
      });
    }

    async function loadAllData() {
      const statusEl = document.getElementById("db-status");
      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let fetched = [];
        let from = 0;
        const step = 1000;
        while (true) {
          const { data, error } = await supabase
            .from("haunted_houses")
            .select("*")
            .range(from, from + step - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          fetched = fetched.concat(data);
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-600 animate-ping"></span> 正在同步雲端 (${fetched.length} 筆)...`;
          if (data.length < step) break;
          from += step;
        }

        allRecords = fetched.map(r => {
          const normalizedCat = classifyRecord(r.category, r.reason);
          return {
            ...r,
            normalizedCat,
            searchBlob: `${r.city || ""}${r.district || ""}${r.address || ""}${r.reason || ""}${r.category || ""}${r.incident_date || ""}`
              .replace(/台/g, "臺")
              .toLowerCase()
          };
        });

        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-600"></span> 雲端即時連線正常 · 共收錄 ${allRecords.length.toLocaleString()} 筆`;
        updateCounters();
        applyFilters();
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-600"></span> 請確認 index.html 已填入正確的 SUPABASE_ANON_KEY`;
      }
    }

    function updateCounters() {
      document.getElementById("count-ALL").textContent = allRecords.length.toLocaleString();
      Object.keys(CATEGORY_STYLES).forEach(cat => {
        const c = allRecords.filter(r => r.normalizedCat === cat).length;
        const el = document.getElementById(`count-${cat}`);
        if (el) el.textContent = c.toLocaleString();
      });
    }

    function renderData(records) {
      markerCluster.clearLayers();
      const listContainer = document.getElementById("list-container");
      const resultLabel = document.getElementById("filter-result-label");

      resultLabel.textContent = `符合條件共 ${records.length.toLocaleString()} 筆事故建物`;

        listContainer.innerHTML = `
          <div class="p-8 text-center space-y-2">
            <div class="text-sm font-bold text-slate-700">目前篩選條件下無相符紀錄</div>

        return;
      }

      records.forEach((item, idx) => {
        if (!item.lat || !item.lng) return;
        const style = CATEGORY_STYLES[item.normalizedCat] || CATEGORY_STYLES["法拍與其他"];

        const icon = L.divIcon({

          iconAnchor: [9, 9],

        // 完整房產情報與外部連結彈出視窗
        const popupHtml = `
          <div class="w-[310px] sm:w-[340px] text-slate-800">
            <!-- 分類標籤與發生時間 -->
            <div class="flex items-center justify-between gap-2 mb-2">

            </div>

            <!-- 地址與行政區 -->

            <!-- 事件原因詳細摘要 -->

              <div class="text-xs text-slate-800 leading-relaxed font-medium">${item.reason || "公開法拍筆錄或歷史新聞載明該建物曾發生非自然死亡事故。"}</div>
            </div>

            <!-- 房地產歷年行情與折價評估區塊 -->
            <div class="bg-blue-50/60 p-3 rounded-xl border border-blue-100 mb-3">
              <div class="text-[11px] font-bold text-blue-900 mb-1.5 flex items-center justify-between">
                <span>🏠 區域房產行情與特殊折價評估</span>

              </div>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-white p-2 rounded-lg border border-slate-200/80">
                  <span class="block text-[10px] text-slate-400">同區正常住宅均價</span>

                <div class="bg-white p-2 rounded-lg border border-red-200">
                  <span class="block text-[10px] text-red-500">事故屋預估折價 (${info.discountPercent}折)</span>

                </div>
              </div>
            </div>

            <!-- 依據來源說明 -->
            <div class="text-[11px] text-slate-500 mb-2.5 flex items-center justify-between">
              <span>📚 依據來源：<strong class="text-slate-700">${info.readableSource}</strong></span>
            </div>

            <!-- 4大真實外部超連結按鈕 -->
            <div class="grid grid-cols-2 gap-1.5 pt-2 border-t border-slate-200">
              <a href="${info.googleMapsUrl}" target="_blank" rel="noopener noreferrer"
                class="flex items-center justify-center gap-1 px-2.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 !text-white text-xs font-semibold no-underline transition">
                📍 Google 地圖/街景
              </a>
              <a href="${info.googleNewsUrl}" target="_blank" rel="noopener noreferrer"
                class="flex items-center justify-center gap-1 px-2.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 !text-white text-xs font-semibold no-underline transition">
                📰 查原始新聞報導
              </a>
              <a href="${info.googleWebSearchUrl}" target="_blank" rel="noopener noreferrer"
                class="flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 !text-slate-700 text-[11px] font-semibold no-underline border border-slate-300 transition">

                class="flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 !text-slate-700 text-[11px] font-semibold no-underline border border-slate-300 transition">

        const marker = L.marker([item.lat, item.lng], { icon }).bindPopup(popupHtml, { maxWidth: 360 });
        markerCluster.addLayer(marker);

        if (idx < 350) {
          const row = document.createElement("div");
          row.className = "p-4 bg-white hover:bg-blue-50/40 cursor-pointer transition group";
          row.innerHTML = `
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded border ${style.badge}">${style.label}</span>
                <span class="text-xs font-bold text-slate-700">${item.city} ${item.district}</span>
              </div>
              <span class="text-[11px] font-mono font-medium text-slate-500">${item.incident_date || "歷年紀錄"}</span>
            </div>

            <div class="text-sm font-extrabold text-slate-900 group-hover:text-blue-600 transition mb-1">${item.address}</div>
            <div class="text-xs text-slate-600 line-clamp-2 leading-relaxed mb-2.5">${item.reason || ""}</div>

            <!-- 列表卡片底部直接顯示預估行情與快速外部連結 -->
            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-[11px]">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">${info.buildingType}</span>
                <span class="text-red-600 font-bold">預估約 ${info.estimatedIncidentPrice} 萬/坪 (${info.discountPercent}折)</span>
              </div>
              <div class="flex items-center gap-2" onclick="event.stopPropagation();">
                <a href="${info.googleMapsUrl}" target="_blank" class="text-blue-600 hover:underline font-semibold">Google地圖 ↗</a>
                <a href="${info.googleNewsUrl}" target="_blank" class="text-slate-600 hover:text-slate-900 hover:underline font-semibold">查新聞 ↗</a>
              </div>
            </div>
          `;
          row.addEventListener("click", () => {
            map.flyTo([item.lat, item.lng], 17, { duration: 0.7 });
            setTimeout(() => {
              markerCluster.zoomToShowLayer(marker, () => marker.openPopup());
            }, 750);
          });
          listContainer.appendChild(row);
        }
      });
    }

    function applyFilters() {
      const city = citySelect.value.trim();
      const dist = districtSelect.value.trim();
      const sort = sortSelect.value;
      const rawKw = searchInput.value.trim().replace(/台/g, "臺").toLowerCase();

      let tokens = rawKw.split(/\s+/).filter(Boolean);
      if (tokens.length === 1 && rawKw.length === 4) {
        tokens = [rawKw.slice(0, 2), rawKw.slice(2, 4)];
      }

      let filtered = allRecords.filter(r => {
        const matchCat = activeCategory === "ALL" || r.normalizedCat === activeCategory;
        const matchCity = !city || r.city.replace("台","臺") === city.replace("台","臺");
        const matchDist = !dist || r.district === dist;
        const matchKw = tokens.length === 0 || tokens.every(t => r.searchBlob.includes(t));
        return matchCat && matchCity && matchDist && matchKw;
      });

      filtered.sort((a, b) => {
        const da = a.incident_date || "0000-00-00";
        const db = b.incident_date || "0000-00-00";
        return sort === "date_desc" ? db.localeCompare(da) : da.localeCompare(db);
      });

      renderData(filtered);
      if (filtered.length > 0 && (city || dist || rawKw)) {
        const bounds = L.latLngBounds(filtered.map(r => [r.lat, r.lng]));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    loadAllData();
  </script>
</body>
</html>
