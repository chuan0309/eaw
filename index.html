    body, html { margin: 0; padding: 0; height: 100%; background-color: #0b0f17; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    #map { width: 100%; height: 100%; background: #0f172a; }

    /* 免 API KEY 高質感深色地圖濾鏡（將免費 OpenStreetMap / 內政部國土測繪圖資轉為高冷深色風，絕無水印） */
    .dark-map-tiles {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(92%) saturate(65%);
    }

    /* 5大死因彩色發光座標點 */
    .pin-base {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2.5px solid #ffffff;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-base:hover { transform: scale(1.45); z-index: 999 !important; }
    .pin-homicide { background-color: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.9); }   /* 刑事/兇殺：紅 */
    .pin-suicide  { background-color: #f97316; box-shadow: 0 0 12px rgba(249, 115, 22, 0.9); }  /* 輕生/墜樓：橘 */
    .pin-accident { background-color: #a855f7; box-shadow: 0 0 12px rgba(168, 85, 247, 0.9); }  /* 意外/火警：紫 */
    .pin-natural  { background-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.9); }  /* 自然/孤獨死：藍 */
    .pin-court    { background-color: #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.9); }  /* 法拍/其他：綠 */

    /* 彈出視窗質感卡片 */
    .leaflet-popup-content-wrapper {
      background: #111827 !important; color: #f8fafc !important;
      border: 1px solid #334155; border-radius: 12px !important;
      box-shadow: 0 20px 35px rgba(0,0,0,0.85) !important;
      padding: 4px;
    }
    .leaflet-popup-tip { background: #111827 !important; border: 1px solid #334155; }
    .leaflet-container a.leaflet-popup-close-button { color: #94a3b8 !important; font-size: 18px !important; top: 8px !important; right: 8px !important; }

    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: #0f172a !important; color: #f8fafc !important;
      border: 1.5px solid #64748b; font-weight: 700; font-family: monospace;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

      </div>
    </div>

    <!-- 死因分類快速過濾膠囊按鈕 -->
    <div class="flex flex-wrap items-center gap-2" id="category-tabs">

        <span id="count-刑事命案" class="font-mono text-slate-300">0</span>

    function classifyRecord(rawCat, rawReason) {
      const text = `${rawCat || ""} ${rawReason || ""}`;
      if (/兇殺|命案|他殺|情殺|仇殺|分屍|槍擊|砍殺|刑事/.test(text)) return "刑事命案";

      if (/火警|火災|一氧化碳|瓦斯|中毒|氣爆|溺水|工安|意外/.test(text)) return "意外身亡";
      if (/自然|久病|獨居|孤獨死|暴斃|猝死|病逝/.test(text)) return "自然或孤獨死";

      className: "dark-map-tiles"
    });

    const nlscLightLayer = L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}", {
      attribution: '&copy; 內政部國土測繪中心 NLSC &copy; OpenStreetMap',
      maxZoom: 19
    });

    let isDarkMap = true;
    nlscDarkLayer.addTo(map);

    document.getElementById("toggle-map-style").addEventListener("click", () => {
      if (isDarkMap) {
        map.removeLayer(nlscDarkLayer);
        nlscLightLayer.addTo(map);
      } else {
        map.removeLayer(nlscLightLayer);
        nlscDarkLayer.addTo(map);
      }
      isDarkMap = !isDarkMap;
    });

    const markerCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 42 });
    map.addLayer(markerCluster);

    let allRecords = [];
    let activeCategory = "ALL";

    const citySelect = document.getElementById("city-select");
    const districtSelect = document.getElementById("district-select");
    const sortSelect = document.getElementById("sort-select");
    const searchInput = document.getElementById("search-input");

    Object.keys(TAIWAN_DISTRICTS).forEach(city => {
      const opt = document.createElement("option");
      opt.value = city; opt.textContent = city;
      citySelect.appendChild(opt);
    });

    citySelect.addEventListener("change", () => {
      const c = citySelect.value;
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      if (c && TAIWAN_DISTRICTS[c]) {
        TAIWAN_DISTRICTS[c].forEach(d => {
          const opt = document.createElement("option");
          opt.value = d; opt.textContent = d;
          districtSelect.appendChild(opt);
        });
      }
      applyFilters();
    });

    districtSelect.addEventListener("change", applyFilters);
    sortSelect.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);

    document.getElementById("reset-btn").addEventListener("click", () => {
      citySelect.value = "";
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      searchInput.value = "";
      activeCategory = "ALL";
      updateCategoryTabUI();
      applyFilters();
      map.setView([23.75, 120.95], 8);
    });

    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.getAttribute("data-cat");
        updateCategoryTabUI();
        applyFilters();
      });
    });

    function updateCategoryTabUI() {
      document.querySelectorAll(".cat-btn").forEach(btn => {
        if (btn.getAttribute("data-cat") === activeCategory) {
          btn.classList.add("ring-2", "ring-white", "scale-105");
        } else {
          btn.classList.remove("ring-2", "ring-white", "scale-105");
        }
      });
    }

    async function loadAllData() {
      const statusEl = document.getElementById("db-status");
      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let fetched = [];
        let from = 0;
        const step = 1000;
        while (true) {
          const { data, error } = await supabase
            .from("haunted_houses")
            .select("*")
            .range(from, from + step - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          fetched = fetched.concat(data);
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span> 正在同步雲端 (${fetched.length} 筆)...`;
          if (data.length < step) break;
          from += step;
        }

        allRecords = fetched.map(r => ({
          ...r,
          normalizedCat: classifyRecord(r.category, r.reason),
          // 建立正規化全檢索字串（讓「桃園八德」也能直接命中「桃園市 + 八德區」）
          searchBlob: `${r.city || ""}${r.district || ""}${r.address || ""}${r.reason || ""}${r.category || ""}${r.incident_date || ""}`
            .replace(/台/g, "臺")
            .toLowerCase()
        }));

        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> 雲端即時連線正常 · 共收錄 ${allRecords.length.toLocaleString()} 筆`;
        updateCounters();
        applyFilters();
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> 請確認 index.html 第 153 行已貼上 anon public key`;
      }
    }

    function updateCounters() {
      document.getElementById("count-ALL").textContent = allRecords.length.toLocaleString();
      Object.keys(CATEGORY_STYLES).forEach(cat => {
        const c = allRecords.filter(r => r.normalizedCat === cat).length;
        const el = document.getElementById(`count-${cat}`);
        if (el) el.textContent = c.toLocaleString();
      });
    }

    function renderData(records) {
      markerCluster.clearLayers();
      const listContainer = document.getElementById("list-container");
      const resultLabel = document.getElementById("filter-result-label");
      listContainer.innerHTML = "";
      resultLabel.textContent = `符合條件共 ${records.length.toLocaleString()} 筆案件`;

      if (records.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center space-y-2">
            <div class="text-sm font-semibold text-slate-300">目前資料庫中尚無該區域或關鍵字紀錄</div>
            <div class="text-xs text-slate-500 leading-relaxed">
              請複製下方「全臺 368 鄉鎮區深度擴充 SQL 與爬蟲」至 Supabase SQL Editor 或 GitHub Actions 執行，即可立即補齊桃園八德等全臺各區歷年案件！
            </div>
          </div>`;
        return;
      }

      records.forEach((item, idx) => {
        if (!item.lat || !item.lng) return;
        const style = CATEGORY_STYLES[item.normalizedCat] || CATEGORY_STYLES["法拍與其他"];

        const icon = L.divIcon({
          className: "",
          html: `<div class="pin-base ${style.pin}"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8],
          popupAnchor: [0, -8]
        });

        const popupHtml = `
          <div class="p-2.5 min-w-[250px] max-w-[300px]">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${style.badge}">${style.label}</span>
              <span class="text-[11px] font-mono text-slate-400">${item.incident_date || "歷史紀錄"}</span>
            </div>
            <div class="text-[11px] text-slate-400 mb-0.5">${item.city} · ${item.district}</div>
            <h3 class="text-sm font-bold text-white leading-snug mb-2.5">${item.address}</h3>
            <div class="text-xs text-slate-200 bg-slate-900 p-2.5 rounded-lg border border-slate-800 leading-relaxed mb-2">
              <span class="text-slate-400 block text-[10px] mb-1">事件紀錄與死因摘要：</span>
              ${item.reason || "公開卷宗載明之特殊事故建物"}
            </div>
            <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1 border-t border-slate-800">
              <span>原始分類：${item.category || "特殊事故"}</span>
              <span>資料來源：${item.source || "公開檔案"}</span>
            </div>
          </div>
        `;

        const marker = L.marker([item.lat, item.lng], { icon }).bindPopup(popupHtml);
        markerCluster.addLayer(marker);

        if (idx < 350) {
          const row = document.createElement("div");
          row.className = "p-3.5 hover:bg-slate-800/60 cursor-pointer transition group";
          row.innerHTML = `
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${style.badge}">${style.label}</span>
                <span class="text-xs font-medium text-slate-300">${item.city} ${item.district}</span>
              </div>
              <span class="text-[11px] font-mono text-slate-400">${item.incident_date || "歷史紀錄"}</span>
            </div>
            <div class="text-xs font-bold text-white group-hover:text-blue-400 transition mb-1">${item.address}</div>
            <div class="text-[11px] text-slate-400 line-clamp-2 leading-relaxed">${item.reason || ""}</div>
          `;
          row.addEventListener("click", () => {
            map.flyTo([item.lat, item.lng], 17, { duration: 0.7 });
            setTimeout(() => {
              markerCluster.zoomToShowLayer(marker, () => marker.openPopup());
            }, 750);
          });
          listContainer.appendChild(row);
        }
      });
    }

    // 升級版智慧搜尋（支援「桃園八德」自動拆解比對「桃園」+「八德」）
    function applyFilters() {
      const city = citySelect.value.trim();
      const dist = districtSelect.value.trim();
      const sort = sortSelect.value;
      const rawKw = searchInput.value.trim().replace(/台/g, "臺").toLowerCase();

      // 將像「桃園八德」這種連在一起的詞拆成獨立關鍵字陣列
      let tokens = rawKw.split(/\s+/).filter(Boolean);
      if (tokens.length === 1 && rawKw.length === 4) {
        // 例如輸入「桃園八德」、「臺北中山」、「新北板橋」，自動拆為前兩字與後兩字同時比對
        tokens = [rawKw.slice(0, 2), rawKw.slice(2, 4)];
      }

      let filtered = allRecords.filter(r => {
        const matchCat = activeCategory === "ALL" || r.normalizedCat === activeCategory;
        const matchCity = !city || r.city.replace("台","臺") === city.replace("台","臺");
        const matchDist = !dist || r.district === dist;
        const matchKw = tokens.length === 0 || tokens.every(t => r.searchBlob.includes(t));
        return matchCat && matchCity && matchDist && matchKw;
      });

      filtered.sort((a, b) => {
        const da = a.incident_date || "0000-00-00";
        const db = b.incident_date || "0000-00-00";
        return sort === "date_desc" ? db.localeCompare(da) : da.localeCompare(db);
      });

      renderData(filtered);
      if (filtered.length > 0 && (city || dist || rawKw)) {
        const bounds = L.latLngBounds(filtered.map(r => [r.lat, r.lng]));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    loadAllData();
  </script>
</body>
</html>
