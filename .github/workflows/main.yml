name: 24H 全自動臺灣凶宅爬蟲與全模型 AI 萃取

on:
  push:
    branches: [ main, master ] # 只要你修改上傳任何檔案，立刻在背景啟動爬蟲！
  schedule:
    - cron: '15 * * * *'       # 每小時的第 15 分鐘在雲端背景自動醒來抓資料！
  workflow_dispatch:           # 隨時可手動點按執行

jobs:
  crawl_and_update_db:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝所需套件
        run: |
          pip install --upgrade pip
          pip install google-genai supabase requests

      - name: 4. 啟動全縣市輪詢爬蟲並寫入 Supabase
        env:
          SUPABASE_URL: "https://cfmcvcscyfblcodemnkt.supabase.co"
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python crawler.py
