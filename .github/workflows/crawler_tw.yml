name: Taiwan Haunted Property Crawler (臺灣獨立爬蟲)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-taiwan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Taiwan Crawler (368 Districts)
        run: python crawler_tw.py

      - name: Commit and Push updated archive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A calibrated_archive.json public/calibrated_archive.json initial_boot_records.json public/initial_boot_records.json crawler_vault_backup.json public/crawler_vault_backup.json
          git diff --staged --quiet || (git commit -m "Auto-update: Taiwan 368 districts crawler [skip ci]" && git pull --rebase --autostash origin main && git push)
