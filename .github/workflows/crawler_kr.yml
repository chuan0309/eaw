name: South Korea Haunted Property Crawler (韓國全境獨立爬蟲)

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-korea:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run South Korea Crawler (14 Cities & Provinces / 89 Districts)
        run: python crawler_kr.py

      - name: Commit and Push updated archive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add calibrated_archive.json
          git diff --staged --quiet || (git commit -m "Auto-update: South Korea 89 districts crawler [skip ci]" && git pull --rebase origin main && git push)
