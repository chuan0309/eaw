<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>臺灣特殊事故建物公開資料庫 | 極簡實價與歷史索引</title>
  <!-- Tailwind CSS 極簡排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet 開源地圖核心與聚合插件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <!-- Supabase 前端 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; background-color: #0a0a0a; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    #map { width: 100%; height: 100%; background: #0f0f0f; }
    /* 自訂極簡黑白地標點 */
    .custom-pin {
      width: 14px; height: 14px; border-radius: 50%;
      background-color: #ffffff; border: 2.5px solid #000000;
      box-shadow: 0 0 10px rgba(255,255,255,0.6);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .custom-pin:hover { transform: scale(1.4); background-color: #ef4444; border-color: #ffffff; }
    /* 自訂極簡黑卡 Popup */
    .leaflet-popup-content-wrapper {
      background: #141414 !important; color: #f5f5f5 !important;
      border: 1px solid #2e2e2e; border-radius: 8px !important;
      box-shadow: 0 12px 30px rgba(0,0,0,0.85) !important;
      padding: 4px;
    }
    .leaflet-popup-tip { background: #141414 !important; border: 1px solid #2e2e2e; }
    .leaflet-container a.leaflet-popup-close-button { color: #888 !important; }
    /* 聚合圓圈改為黑白灰質感 */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(255, 255, 255, 0.15) !important; }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: #171717 !important; color: #ffffff !important;
      border: 1px solid #525252; font-weight: 600;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #141414; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

  <!-- 左側極簡控制與清單欄 -->
  <aside class="w-full md:w-96 bg-[#0f0f0f] border-b md:border-b-0 md:border-r border-neutral-800 flex flex-col z-20 h-[45vh] md:h-full shrink-0">
    <!-- 標題與統計 -->
    <div class="p-5 border-b border-neutral-800 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-wider text-white">臺灣事故建物索引</h1>
        <p class="text-xs text-neutral-500 mt-0.5">自動化歷年實價、法拍與裁判書資料庫</p>
      </div>
      <div class="text-right">
        <span id="total-count" class="text-xl font-mono font-bold text-white">0</span>
        <span class="block text-[10px] text-neutral-500 uppercase tracking-widest">已收錄筆數</span>
      </div>
    </div>

    <!-- 搜尋與縣市區域過濾器 -->
    <div class="p-4 space-y-3 border-b border-neutral-800 bg-[#121212]">
      <div class="grid grid-cols-2 gap-2">
        <select id="city-select" class="bg-neutral-900 border border-neutral-700 text-neutral-200 text-xs rounded px-3 py-2.5 focus:outline-none focus:border-white transition">
          <option value="">全臺灣 (所有縣市)</option>
        </select>
        <select id="district-select" class="bg-neutral-900 border border-neutral-700 text-neutral-200 text-xs rounded px-3 py-2.5 focus:outline-none focus:border-white transition">
          <option value="">所有行政區</option>
        </select>
      </div>
      <div class="relative">
        <input id="search-input" type="text" placeholder="輸入路段、社區、門牌或事故原因查詢..."
          class="w-full bg-neutral-900 border border-neutral-700 text-neutral-100 text-xs rounded px-3 py-2.5 pr-16 focus:outline-none focus:border-white transition placeholder-neutral-600" />
        <button id="reset-btn" class="absolute right-2 top-1/2 -translate-y-1/2 text-[11px] text-neutral-400 hover:text-white px-2 py-1 bg-neutral-800 rounded">
          重設
        </button>
      </div>
    </div>

    <!-- 結果清單 -->
    <div id="list-container" class="flex-1 overflow-y-auto divide-y divide-neutral-800/70"></div>

    <!-- 底部狀態列 -->
    <div class="p-3 border-t border-neutral-800 text-[11px] text-neutral-500 flex justify-between items-center bg-[#0a0a0a]">
      <span id="db-status" class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端即時連線中
      </span>
      <span>OpenStreetMap / CartoDB</span>
    </div>
  </aside>

  <!-- 右側互動式地圖 -->
  <main class="flex-1 relative h-[55vh] md:h-full">
    <div id="map"></div>
  </main>

  <script>
    // ============================================================================
    // 【請在這裡填入你第一步拿到的 Supabase 網址與 anon public Key】
    // ============================================================================
    const SUPABASE_URL = "在此貼上你的_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "在此貼上你的_SUPABASE_ANON_PUBLIC_KEY";

    // 臺灣全縣市與行政區字典
    const TAIWAN_DISTRICTS = {
      "臺北市": ["中正區","大同區","中山區","松山區","大安區","萬華區","信義區","士林區","北投區","內湖區","南港區","文山區"],
      "新北市": ["板橋區","三重區","中和區","永和區","新莊區","新店區","土城區","蘆洲區","樹林區","汐止區","鶯歌區","三峽區","淡水區","瑞芳區","五股區","泰山區","林口區","深坑區","石碇區","坪林區","三芝區","石門區","八里區","平溪區","雙溪區","貢寮區","金山區","萬里區","烏來區"],
      "桃園市": ["桃園區","中壢區","平鎮區","八德區","楊梅區","蘆竹區","大溪區","龍潭區","龜山區","大園區","觀音區","新屋區","復興區"],
      "臺中市": ["中區","東區","南區","西區","北區","北屯區","西屯區","南屯區","太平區","大里區","霧峰區","烏日區","豐原區","后里區","石岡區","東勢區","和平區","新社區","潭子區","大雅區","神岡區","大肚區","沙鹿區","龍井區","梧棲區","清水區","大甲區","外埔區","大安區"],
      "臺南市": ["中西區","東區","南區","北區","安平區","安南區","永康區","歸仁區","新化區","左鎮區","玉井區","楠西區","南化區","仁德區","關廟區","龍崎區","官田區","麻豆區","佳里區","西港區","七股區","將軍區","學甲區","北門區","新營區","後壁區","白河區","東山區","六甲區","下營區","柳營區","鹽水區","善化區","大內區","山上區","新市區","安定區"],
      "高雄市": ["新興區","前金區","苓雅區","鹽埕區","鼓山區","旗津區","前鎮區","三民區","楠梓區","小港區","左營區","仁武區","大社區","岡山區","路竹區","阿蓮區","田寮區","燕巢區","橋頭區","梓官區","彌陀區","永安區","湖內區","鳳山區","大寮區","林園區","鳥松區","大樹區","旗山區","美濃區","六龜區","內門區","杉林區","甲仙區","桃源區","那瑪夏區","茂林區","茄萣區"],
      "基隆市": ["仁愛區","信義區","中正區","中山區","安樂區","暖暖區","七堵區"],
      "新竹市": ["東區","北區","香山區"],
      "新竹縣": ["竹北市","竹東鎮","新埔鎮","關西鎮","湖口鄉","新豐鄉","芎林鄉","橫山鄉","北埔鄉","寶山鄉","峨眉鄉","尖石鄉","五峰鄉"],
      "苗栗縣": ["苗栗市","頭份市","竹南鎮","後龍鎮","通霄鎮","苑裡鎮","卓蘭鎮","造橋鄉","西湖鄉","頭屋鄉","公館鄉","銅鑼鄉","三義鄉","大湖鄉","獅潭鄉","三灣鄉","南庄鄉","泰安鄉"],
      "彰化縣": ["彰化市","員林市","和美鎮","鹿港鎮","溪湖鎮","二林鎮","田中鎮","北斗鎮","花壇鄉","芬園鄉","大村鄉","永靖鄉","伸港鄉","線西鄉","福興鄉","秀水鄉","埔心鄉","埔鹽鄉","大城鄉","芳苑鄉","竹塘鄉","社頭鄉","二水鄉","田尾鄉","埤頭鄉","溪州鄉"],
      "南投縣": ["南投市","埔里鎮","草屯鎮","竹山鎮","集集鎮","名間鄉","鹿谷鄉","中寮鄉","魚池鄉","國姓鄉","水里鄉","信義鄉","仁愛鄉"],
      "雲林縣": ["斗六市","斗南鎮","虎尾鎮","西螺鎮","土庫鎮","北港鎮","古坑鄉","大埤鄉","莿桐鄉","林內鄉","二崙鄉","崙背鄉","麥寮鄉","東勢鄉","褒忠鄉","臺西鄉","元長鄉","四湖鄉","口湖鄉","水林鄉"],
      "嘉義市": ["東區","西區"],
      "嘉義縣": ["太保市","朴子市","布袋鎮","大林鎮","民雄鄉","溪口鄉","新港鄉","六腳鄉","東石鄉","義竹鄉","鹿草鄉","水上鄉","中埔鄉","竹崎鄉","梅山鄉","番路鄉","大埔鄉","阿里山鄉"],
      "屏東縣": ["屏東市","潮州鎮","東港鎮","恆春鎮","萬丹鄉","長治鄉","麟洛鄉","九如鄉","里港鄉","鹽埔鄉","高樹鄉","萬巒鄉","內埔鄉","竹田鄉","新埤鄉","枋寮鄉","新園鄉","崁頂鄉","林邊鄉","南州鄉","佳冬鄉","琉球鄉","車城鄉","滿州鄉","枋山鄉","三地門鄉","霧臺鄉","瑪家鄉","泰武鄉","來義鄉","春日鄉","獅子鄉","牡丹鄉"],
      "宜蘭縣": ["宜蘭市","羅東鎮","蘇澳鎮","頭城鎮","礁溪鄉","壯圍鄉","員山鄉","冬山鄉","五結鄉","三星鄉","大同鄉","南澳鄉"],
      "花蓮縣": ["花蓮市","鳳林鎮","玉里鎮","新城鄉","吉安鄉","壽豐鄉","光復鄉","豐濱鄉","瑞穗鄉","富里鄉","秀林鄉","萬榮鄉","卓溪鄉"],
      "臺東縣": ["臺東市","成功鎮","關山鎮","卑南鄉","鹿野鄉","池上鄉","東河鄉","長濱鄉","太麻里鄉","大武鄉","綠島鄉","海端鄉","延平鄉","金峰鄉","達仁鄉","蘭嶼鄉"],
      "澎湖縣": ["馬公市","湖西鄉","白沙鄉","西嶼鄉","望安鄉","七美鄉"],
      "金門縣": ["金城鎮","金湖鎮","金沙鎮","金寧鄉","烈嶼鄉","烏坵鄉"],
      "連江縣": ["南竿鄉","北竿鄉","莒光鄉","東引鄉"]
    };

    // 預設種子資料（尚未連接 Supabase 時也能直接預覽測試）
    const FALLBACK_DATA = [
      { id: 1, city: "臺北市", district: "中山區", address: "臺北市中山區林森北路錦州街口某大樓", lat: 25.0598, lng: 121.5262, incident_date: "1998-07-28", category: "重大火災/命案", reason: "歷史大樓火警與多起非自然身亡紀錄，實價與法拍多次備註。", source: "法拍公告/實價歷史" },
      { id: 2, city: "臺北市", district: "萬華區", address: "臺北市萬華區西寧南路某商業住宅大樓", lat: 25.0449, lng: 121.5065, incident_date: "2004-02-26", category: "非自然身亡", reason: "歷年累計多起墜樓與屋內非自然死亡事件，列為著名特殊事故建物。", source: "公開新聞/裁判書" },
      { id: 3, city: "新北市", district: "新店區", address: "新北市新店區碧潭路某社區住宅", lat: 24.9562, lng: 121.5361, incident_date: "2019-11-12", category: "一氧化碳/輕生", reason: "法院法拍筆錄載明屋內曾發生非自然死亡事故（依點交備註）。", source: "司法院法拍屋公告" },
      { id: 4, city: "臺中市", district: "西屯區", address: "臺中市西屯區臺灣大道三段某套房大樓", lat: 24.1678, lng: 120.6425, incident_date: "2021-05-19", category: "屋內輕生", reason: "租客於室內發生非自然身亡，民事判決瑕疵擔保案件記載。", source: "司法院裁判書系統" },
      { id: 5, city: "高雄市", district: "鹽埕區", address: "高雄市鹽埕區府北路某住商混合大樓", lat: 22.6285, lng: 120.2845, incident_date: "2021-10-14", category: "重大火警事故", reason: "重大火災造成多起傷亡紀錄，相關建物與原址歷史備註。", source: "公開新聞/歷史檔案" }
    ];

    // 初始化極簡黑灰地圖 (CartoDB Dark Matter)
    const map = L.map("map", { zoomControl: false }).setView([23.75, 120.95], 8);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: "abcd",
      maxZoom: 20
    }).addTo(map);

    const markerCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
    map.addLayer(markerCluster);

    let allRecords = [];
    let markerMap = new Map();

    // 初始化縣市下拉選單
    const citySelect = document.getElementById("city-select");
    const districtSelect = document.getElementById("district-select");
    const searchInput = document.getElementById("search-input");
    const resetBtn = document.getElementById("reset-btn");

    Object.keys(TAIWAN_DISTRICTS).forEach(city => {
      const opt = document.createElement("option");
      opt.value = city; opt.textContent = city;
      citySelect.appendChild(opt);
    });

    citySelect.addEventListener("change", () => {
      const selectedCity = citySelect.value;
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      if (selectedCity && TAIWAN_DISTRICTS[selectedCity]) {
        TAIWAN_DISTRICTS[selectedCity].forEach(dist => {
          const opt = document.createElement("option");
          opt.value = dist; opt.textContent = dist;
          districtSelect.appendChild(opt);
        });
      }
      applyFilters();
    });

    districtSelect.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);
    resetBtn.addEventListener("click", () => {
      citySelect.value = "";
      districtSelect.innerHTML = '<option value="">所有行政區</option>';
      searchInput.value = "";
      applyFilters();
      map.setView([23.75, 120.95], 8);
    });

    // 從 Supabase 雲端載入全量資料（使用自動分頁突破 1000 筆限制，支援上萬筆）
    async function loadAllData() {
      const statusEl = document.getElementById("db-status");
      if (!SUPABASE_URL.startsWith("http")) {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> 預覽模式 (請填入 Supabase URL 以啟用萬筆雲端庫)`;
        allRecords = FALLBACK_DATA;
        renderData(allRecords);
        return;
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let fetched = [];
        let from = 0;
        const step = 1000;
        while (true) {
          const { data, error } = await supabase
            .from("haunted_houses")
            .select("*")
            .order("incident_date", { ascending: false })
            .range(from, from + step - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          fetched = fetched.concat(data);
          if (data.length < step) break;
          from += step;
        }
        allRecords = fetched.length > 0 ? fetched : FALLBACK_DATA;
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 雲端資料庫已同步 (${allRecords.length} 筆)`;
        renderData(allRecords);
      } catch (err) {
        console.error("資料庫讀取失敗，載入預設展示資料:", err);
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> 離線展示模式`;
        allRecords = FALLBACK_DATA;
        renderData(allRecords);
      }
    }

    // 繪製地圖標記與左側清單
    function renderData(records) {
      markerCluster.clearLayers();
      markerMap.clear();
      const listContainer = document.getElementById("list-container");
      listContainer.innerHTML = "";
      document.getElementById("total-count").textContent = records.length.toLocaleString();

      const customIcon = L.divIcon({
        className: "",
        html: '<div class="custom-pin"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7],
        popupAnchor: [0, -8]
      });

      records.forEach(item => {
        if (!item.lat || !item.lng) return;
        const popupHtml = `
          <div class="p-2 min-w-[230px] max-w-[280px]">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-[10px] font-mono px-2 py-0.5 bg-neutral-800 text-neutral-300 rounded border border-neutral-700">${item.city} · ${item.district}</span>
              <span class="text-[11px] font-mono text-neutral-400">${item.incident_date || "歷史紀錄"}</span>
            </div>
            <h3 class="text-sm font-bold text-white leading-snug mb-2">${item.address}</h3>
            <div class="text-xs text-neutral-300 bg-neutral-900/90 p-2.5 rounded border border-neutral-800 leading-relaxed mb-2">
              <span class="text-neutral-500 block text-[10px] mb-0.5">事件原因與經過：</span>
              ${item.reason || "特殊事故紀錄"}
            </div>
            <div class="flex justify-between items-center text-[10px] text-neutral-500">
              <span>分類：${item.category || "非自然死亡"}</span>
              <span>來源：${item.source || "公開卷宗"}</span>
            </div>
          </div>
        `;

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).bindPopup(popupHtml);
        markerCluster.addLayer(marker);
        markerMap.set(item.id, marker);

        // 左側列表項目
        const row = document.createElement("div");
        row.className = "p-4 hover:bg-neutral-900/80 cursor-pointer transition group";
        row.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-medium text-neutral-400">${item.city} ${item.district}</span>
            <span class="text-[11px] font-mono text-neutral-500">${item.incident_date || "年代不詳"}</span>
          </div>
          <div class="text-xs font-semibold text-neutral-200 group-hover:text-white mb-1 truncate">${item.address}</div>
          <div class="text-[11px] text-neutral-500 line-clamp-2 leading-relaxed">${item.reason || ""}</div>
        `;
        row.addEventListener("click", () => {
          map.flyTo([item.lat, item.lng], 17, { duration: 0.8 });
          setTimeout(() => {
            markerCluster.zoomToShowLayer(marker, () => marker.openPopup());
          }, 850);
        });
        listContainer.appendChild(row);
      });
    }

    // 執行區域與地址篩選
    function applyFilters() {
      const city = citySelect.value.trim();
      const dist = districtSelect.value.trim();
      const kw = searchInput.value.trim().toLowerCase();

      const filtered = allRecords.filter(r => {
        const matchCity = !city || r.city === city || r.city.replace("台","臺") === city.replace("台","臺");
        const matchDist = !dist || r.district === dist;
        const matchKw = !kw ||
          (r.address && r.address.toLowerCase().includes(kw)) ||
          (r.reason && r.reason.toLowerCase().includes(kw)) ||
          (r.category && r.category.toLowerCase().includes(kw));
        return matchCity && matchDist && matchKw;
      });

      renderData(filtered);
      if (filtered.length > 0 && (city || dist || kw)) {
        const bounds = L.latLngBounds(filtered.map(r => [r.lat, r.lng]));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    loadAllData();
  </script>
</body>
</html>
